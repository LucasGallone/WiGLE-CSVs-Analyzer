<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wigle_analyzer_theme_v1');
          var isDark = stored ? stored === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <title>WiGLE WiFi CSVs Analyzer</title>
    <meta name="description" content="A web interface for analyzing CSV files generated with WiGLE for Android. Analysis of detected WiFi networks, visualization on an interactive map, detailed summaries of encryption types..." />
    <meta property="og:title" content="WiGLE WiFi CSVs Analyzer" />
    <meta property="og:description" content="A web interface for analyzing CSV files generated with WiGLE for Android. Analysis of detected WiFi networks, visualization on an interactive map, detailed summaries of encryption types..." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen antialiased selection:bg-cyan-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
